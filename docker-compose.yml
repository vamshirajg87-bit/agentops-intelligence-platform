services:

  kafka:
    image: apache/kafka:4.1.0
    container_name: agentops-kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: "PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://agentops-kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@agentops-kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

    volumes:
      - kafka-data:/var/lib/kafka/data

    networks:
      - agentops-net


  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    container_name: agentops-otel-collector

    command:
      - "--config=/etc/otelcol-contrib/config.yaml"

    volumes:
      - ./collector/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro

    ports:
      - "4317:4317"
      - "4318:4318"

    depends_on:
      - kafka

    networks:
      - agentops-net


  kafka-init:
    image: apache/kafka:4.1.0
    container_name: agentops-kafka-init

    depends_on:
      - kafka

    command:
      - /bin/bash
      - -c
      - |
        echo "Waiting for Kafka..."
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server agentops-kafka:29092 --list >/dev/null 2>&1; do
          sleep 2
        done

        echo "Creating Kafka topics..."

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server agentops-kafka:29092 \
          --create \
          --if-not-exists \
          --topic agentops.telemetry.otlp.traces \
          --partitions 3 \
          --replication-factor 1

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server agentops-kafka:29092 \
          --create \
          --if-not-exists \
          --topic agentops.telemetry.spans \
          --partitions 3 \
          --replication-factor 1

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server agentops-kafka:29092 \
          --create \
          --if-not-exists \
          --topic agentops.telemetry.dlq \
          --partitions 3 \
          --replication-factor 1

        echo "Kafka topics ready."

    networks:
      - agentops-net


networks:
  agentops-net:
    name: agentops-net


volumes:
  kafka-data: