<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgentOps Trace Viewer</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="app-header">
    <h1 class="app-title">AgentOps Trace Viewer</h1>
    <nav class="filter-nav" aria-label="Trace filter">
      <button id="filter-all" class="filter-btn" aria-pressed="true" type="button">All</button>
      <button id="filter-errors" class="filter-btn" aria-pressed="false" type="button">Errors Only</button>
      <button id="filter-healthy" class="filter-btn" aria-pressed="false" type="button">Healthy</button>
    </nav>
  </header>
  <main class="app-main">
    <div id="status-region" class="status-region" role="status" aria-live="polite" aria-atomic="true"></div>
    <div id="error-banner" class="error-banner hidden" role="alert">
      <span id="error-message" class="error-message"></span>
      <button id="retry-btn" class="retry-btn" type="button">Retry</button>
    </div>
    <div class="table-wrapper">
      <table id="traces-table" aria-label="Trace list">
        <thead>
          <tr>
            <th scope="col">Status</th>
            <th scope="col">Started (UTC)</th>
            <th scope="col">Duration</th>
            <th scope="col">Root Operation</th>
            <th scope="col">Service</th>
            <th scope="col" class="align-right">Spans</th>
            <th scope="col">Breakdown</th>
            <th scope="col">Trace ID</th>
          </tr>
        </thead>
        <tbody id="traces-body"></tbody>
      </table>
    </div>
    <footer class="table-footer">
      <span id="count-display" class="count-display" aria-live="polite"></span>
      <nav class="pagination" aria-label="Page navigation">
        <button id="prev-btn" class="page-btn" type="button" aria-label="Previous page">Prev</button>
        <span id="page-indicator" class="page-indicator" aria-live="polite" aria-atomic="true"></span>
        <button id="next-btn" class="page-btn" type="button" aria-label="Next page">Next</button>
      </nav>
    </footer>
  </main>
</body>
</html>
